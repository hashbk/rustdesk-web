<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="RustDesk Web — browser-based remote desktop client">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RustDesk Web">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <title>RustDesk Web</title>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <!--
      RustDesk Web entry.

      The TS bridge layer (dist/bridge.js → js/bridge.js) is loaded BEFORE
      flutter.js so that the global `RustDeskBridge` IIFE is available when
      the Dart side calls `js.context['bridge']` / `getByName` / `setByName`.
    -->
    <script src="js/bridge.js" defer></script>
    <script src="flutter.js" defer></script>
  </body>
</html>
