<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="RustDesk Web — browser-based remote desktop client">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RustDesk Web">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <title>RustDesk Web</title>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <!--
      RustDesk Web entry.

      The TS bridge layer (dist/bridge.js → js/bridge.js) is loaded BEFORE
      the Flutter bootstrap script so that the global `RustDeskBridge` IIFE
      is available when the Dart side calls `js.context['bridge']` /
      `getByName` / `setByName`.

      `flutter_bootstrap.js` is generated by `flutter build web` and contains
      the full app initialisation logic (loads flutter.js, sets buildConfig,
      and calls `_flutter.loader.loadEntrypoint()`).  Referencing only
      `flutter.js` leaves the page blank because the loader never starts the
      Dart entrypoint.
    -->
    <script src="js/bridge.js" defer></script>
    <script src="flutter_bootstrap.js" defer></script>
  </body>
</html>
