name: Setup Project
description: Checkout repository, setup Node 24 with npm cache, and install dependencies

inputs:
  submodules:
    description: Submodule checkout strategy (false, recursive, true)
    required: false
    default: recursive

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.submodules }}

    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci