name: Nightly Build

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build Pipeline
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30

  publish:
    name: Publish Nightly Pre-release
    needs: [quality, audit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: flutter-web-dist
          path: web-dist/

      - name: Create release archives
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          tar -czf "rustdesk-web-nightly-${DATE}.tar.gz" -C web-dist .
          (cd web-dist && zip -r "../rustdesk-web-nightly-${DATE}.zip" .)

      - name: Create nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ env.DATE }}
          name: Nightly Build (${{ env.DATE }})
          files: |
            rustdesk-web-nightly-${{ env.DATE }}.tar.gz
            rustdesk-web-nightly-${{ env.DATE }}.zip
          body: |
            ## Nightly Build — ${{ env.DATE }}

            Automated nightly build from `main` branch.

            **This is a pre-release build and may be unstable.**

            ### Artifacts
            - `rustdesk-web-nightly-${{ env.DATE }}.tar.gz` — Flutter Web app (tar.gz)
            - `rustdesk-web-nightly-${{ env.DATE }}.zip` — Flutter Web app (zip)
          prerelease: true
          make_latest: 'false'
          generate_release_notes: false

      - name: Write summary
        run: |
          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality (lint + typecheck + test) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency audit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build pipeline (bridge + flutter-web + e2e) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release publish | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`nightly-${{ env.DATE }}\`" >> $GITHUB_STEP_SUMMARY
