name: Build & E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Build the TS bridge layer and upload dist/bridge.js as an artifact.
  # ------------------------------------------------------------------
  bridge:
    name: Build TS Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bridge
        run: npm run build:bridge

      - name: Verify bridge.js
        run: |
          test -f dist/bridge.js || { echo "dist/bridge.js not found"; exit 1; }
          echo "bridge.js size: $(wc -c < dist/bridge.js) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: bridge-dist
          path: dist/bridge.js
          retention-days: 7

  # ------------------------------------------------------------------
  # Run the bridge integration tests (jsdom) directly against TS source.
  # No artifact dependency needed — vitest compiles on the fly.
  # ------------------------------------------------------------------
  bridge-integration:
    name: Bridge Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bridge integration tests
        run: npx vitest run src/bridge/__tests__/main-handlers.test.ts --reporter=verbose

  # ------------------------------------------------------------------
  # Build the full Flutter Web app, reusing the bridge artifact from
  # the `bridge` job to avoid a redundant build.
  # ------------------------------------------------------------------
  flutter-web:
    name: Build Flutter Web
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: bridge-dist
          path: dist/

      - name: Copy bridge to flutter web
        run: |
          mkdir -p vendor/rustdesk/flutter/web/js
          cp flutter-web/index.html   vendor/rustdesk/flutter/web/index.html
          cp flutter-web/manifest.json vendor/rustdesk/flutter/web/manifest.json
          cp -r flutter-web/icons/    vendor/rustdesk/flutter/web/icons/ 2>/dev/null || true
          cp dist/bridge.js           vendor/rustdesk/flutter/web/js/bridge.js

      - name: Flutter pub get
        run: cd vendor/rustdesk/flutter && flutter pub get

      - name: Flutter build web
        run: cd vendor/rustdesk/flutter && flutter build web --release

      - name: Verify build output
        run: |
          WEB_DIR="vendor/rustdesk/flutter/build/web"
          test -f "$WEB_DIR/index.html"    || { echo "index.html not found";  exit 1; }
          test -f "$WEB_DIR/js/bridge.js"  || { echo "bridge.js not found";   exit 1; }
          test -f "$WEB_DIR/flutter.js"    || { echo "flutter.js not found";  exit 1; }
          echo "All expected files present in Flutter web build"

      - uses: actions/upload-artifact@v7
        with:
          name: flutter-web-dist
          path: vendor/rustdesk/flutter/build/web/
          retention-days: 7

  # ------------------------------------------------------------------
  # Smoke-test the fully built Flutter Web app by serving it over HTTP
  # and verifying that key assets are accessible.
  # ------------------------------------------------------------------
  e2e-smoke:
    name: E2E Smoke Test
    needs: flutter-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: flutter-web-dist
          path: web-dist/

      - name: Serve and verify
        run: |
          python3 -m http.server 8099 --directory web-dist/ &
          SERVER_PID=$!
          sleep 2

          fail() { echo "::error::$1"; kill "$SERVER_PID" 2>/dev/null || true; exit 1; }

          # index.html
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/)
          [ "$STATUS" = "200" ] || fail "index.html fetch failed: HTTP $STATUS"
          echo "index.html served with HTTP 200"

          # bridge.js
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/js/bridge.js)
          [ "$STATUS" = "200" ] || fail "bridge.js fetch failed: HTTP $STATUS"
          echo "bridge.js served with HTTP 200"

          # flutter.js
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/flutter.js)
          [ "$STATUS" = "200" ] || fail "flutter.js fetch failed: HTTP $STATUS"
          echo "flutter.js served with HTTP 200"

          # index.html references bridge.js
          curl -s http://localhost:8099/ | grep -q "bridge.js" \
            || fail "index.html does not reference bridge.js"
          echo "index.html references bridge.js"

          kill "$SERVER_PID" 2>/dev/null || true
          echo "E2E smoke test passed!"