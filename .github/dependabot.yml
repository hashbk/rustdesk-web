version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      vite:
        patterns:
          - vite
          - '@vitejs/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@typescript-eslint/*'
          - eslint-plugin-*
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      xterm:
        patterns:
          - '@xterm/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(submodule)